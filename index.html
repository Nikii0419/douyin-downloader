<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Douyin Downloader</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#1b1d22;--muted:#9298a5;--line:#30333b;--accent:#e9f06a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#343844 0,transparent 55%),var(--bg);color:#f5f6f8;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
main{width:min(560px,100%);margin:auto;padding:calc(30px + env(safe-area-inset-top)) 20px calc(30px + env(safe-area-inset-bottom))}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px}.logo{width:38px;height:38px;border-radius:13px;background:var(--accent);color:#171914;display:grid;place-items:center;font-size:20px}
h1{font-size:34px;line-height:1.12;margin:36px 0 10px;letter-spacing:-1px}.sub{color:var(--muted);line-height:1.6;margin:0 0 28px}
.panel{background:rgba(27,29,34,.94);border:1px solid var(--line);border-radius:22px;padding:17px}
label{display:block;font-size:13px;color:#c1c5ce;margin-bottom:10px}
textarea{width:100%;resize:vertical;min-height:116px;background:#111318;border:1px solid #383c46;border-radius:14px;color:white;padding:14px;font:15px/1.5 inherit;outline:none}
textarea:focus{border-color:var(--accent)}button{border:0;border-radius:14px;padding:15px 18px;font-size:16px;font-weight:700;cursor:pointer}
.primary{width:100%;background:var(--accent);color:#171914;margin-top:13px}.secondary{background:#30343d;color:white}.hint{font-size:12px;color:var(--muted);line-height:1.6;margin:12px 2px 0}
.status{display:none;margin-top:15px;padding:12px 14px;background:#111318;border-radius:12px;color:#d6d9df;font-size:13px;line-height:1.5}.status.show{display:block}
.result{display:none;margin-top:18px}.result.show{display:block}.cover{width:100%;max-height:260px;object-fit:cover;border-radius:14px;background:#111}.meta{font-weight:650;margin:13px 0 5px}.small{font-size:12px;color:var(--muted)}
video{width:100%;max-height:360px;border-radius:14px;background:#000;margin-top:12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.actions button{font-size:14px;padding:13px 8px}
.steps{margin-top:24px;color:var(--muted);font-size:13px;line-height:1.8}.steps b{color:#e7e9ee}
footer{text-align:center;color:#666d79;font-size:11px;margin-top:30px}
</style></head>
<body><main>
<div class="brand"><div class="logo">▶</div><span>DOUYIN TOOLS</span></div>
<h1>抖音视频<br>解析下载</h1>
<p class="sub">粘贴分享链接，提取视频并下载。为 iPhone Safari 优化。</p>
<section class="panel">
<label for="share">抖音分享链接 / 分享文案</label>
<textarea id="share" placeholder="复制抖音里的分享链接，粘贴到这里…"></textarea>
<button class="primary" id="parse">解析视频</button>
<div class="status" id="status" role="status"></div>
<div class="result" id="result">
<img class="cover" id="cover" alt="视频封面" hidden>
<div class="meta" id="title"></div><div class="small" id="author"></div>
<video id="player" controls playsinline webkit-playsinline></video>
<div class="actions">
<button class="primary" id="download">下载视频</button>
<button class="secondary" id="copy">复制视频地址</button>
</div>
<p class="hint">iPhone 下载后通常会保存到「文件」App 的下载项目。要放进照片：打开视频文件 → 分享 → 存储视频。</p>
</div>
</section>
<div class="steps"><b>使用方法</b><br>1. 在抖音点「分享」→「复制链接」<br>2. 回到本页面粘贴并点击「解析视频」<br>3. 预览确认后下载；建议使用 Safari 打开本网站</div>
<footer>仅供下载本人拥有或已获授权的视频，请遵守平台规则及版权法律。</footer>
</main>
<script>
const $=id=>document.getElementById(id);
let currentUrl="";
function message(s){$("status").textContent=s;$("status").classList.add("show")}
$("parse").addEventListener("click",async()=>{
 const raw=$("share").value.trim();
 if(!raw){message("请先粘贴抖音分享链接或分享文案。");return}
 $("parse").disabled=true;$("parse").textContent="正在解析…";$("result").classList.remove("show");
 message("正在识别链接并获取视频信息，请稍候…");
 try{
  const r=await fetch("/api/parse",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:raw})});
  const data=await r.json();
  if(!r.ok||!data.videoUrl)throw new Error(data.error||"解析失败，请检查链接或稍后重试。");
  currentUrl=data.videoUrl;
  $("title").textContent=data.description||"抖音视频";
  $("author").textContent=data.author?("作者："+data.author):"";
  if(data.cover){$("cover").src=data.cover;$("cover").hidden=false}else{$("cover").hidden=true}
  $("player").src="/api/download?url="+encodeURIComponent(currentUrl)+"&inline=1";
  $("result").classList.add("show");message("解析成功，可以预览或下载。");
 }catch(e){message(e.message||"网络异常，请稍后重试。")}
 finally{$("parse").disabled=false;$("parse").textContent="解析视频"}
});
$("download").addEventListener("click",()=>{
 if(!currentUrl)return;
 // Use same-origin endpoint so Safari receives a downloadable MP4 response.
 location.href="/api/download?url="+encodeURIComponent(currentUrl);
});
$("copy").addEventListener("click",async()=>{
 if(!currentUrl)return;
 try{await navigator.clipboard.writeText(currentUrl);message("视频地址已复制。")}
 catch(e){message("复制失败，请长按视频预览或使用下载按钮。")}
});
</script></body></html>
